plugins {
    id 'com.android.application' version '8.7.2'
    id 'org.jetbrains.kotlin.android' version '2.3.0'
    id 'org.jetbrains.kotlin.kapt' version '2.3.0'
}

android {
    namespace 'com.dorflix.app'
    compileSdk = 35

    defaultConfig {
        applicationId "com.dorflix.app"
        minSdk = 24
        targetSdk = 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions -frtti"
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        ndk {
            abiFilters 'arm64-v8a','armeabi-v7a'
        }
    }

    // Use specified NDK version
    ndkVersion = "25.2.9519653"

    // Ensure native libraries are packaged correctly
    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libdorflix-native.so'
        pickFirst '**/libavformat.so'
        pickFirst '**/libavcodec.so'
        pickFirst '**/libavutil.so'
        pickFirst '**/libswscale.so'
        pickFirst '**/libswresample.so'
        pickFirst '**/libavfilter.so'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildFeatures {
        viewBinding = true
        dataBinding = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    
    // Fragment KTX for viewModels()
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.7"
    
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'
    
    implementation 'androidx.media:media:1.7.0'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}